<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera · Clásico Mejorado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a2639 0%, #2c3e50 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .game-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 48px;
            padding: 32px 24px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #f1c40f;
            text-shadow: 0 4px 0 #9a5c1a, 0 8px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            word-break: break-word;
        }
        .score-panel {
            background: #0f172ab3;
            border-radius: 60px;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 600;
            font-size: 1.6rem;
            border: 2px solid #f1c40f40;
            margin-bottom: 30px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            gap: 15px;
        }
        .badge {
            background: #f1c40f;
            color: #1e293b;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #9e751f;
        }
        .score-number {
            background: #020617;
            padding: 8px 22px;
            border-radius: 40px;
            border: 2px solid #f1c40f;
            color: #f1c40f;
            margin-left: 10px;
        }
        .versus-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px 10px;
            margin-bottom: 30px;
        }
        .player-zone, .computer-zone {
            background: #1e293bcc;
            border-radius: 50px;
            padding: 20px 30px;
            flex: 1 1 250px;
            text-align: center;
            border: 3px solid #475569;
            box-shadow: 0 15px 25px #00000055;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .player-zone {
            border-color: #2ecc71;
        }
        .computer-zone {
            border-color: #e74c3c;
        }
        .choice-label {
            font-size: 1.4rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .choice-icon {
            font-size: 5rem;
            line-height: 1.4;
            filter: drop-shadow(0 8px 6px #00000070);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vs-divider {
            font-size: 2.8rem;
            background: #f1c40f;
            color: black;
            font-weight: 800;
            padding: 10px 25px;
            border-radius: 80px;
            box-shadow: 0 8px 0 #9a5c1a;
            transform: rotate(2deg);
            border: 2px solid white;
        }
        .result-box {
            background: #0b1321ee;
            border-radius: 60px;
            padding: 20px;
            margin: 20px 0 30px;
            border: 3px solid #f1c40f;
            text-align: center;
        }
        .result-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ecf0f1;
            text-shadow: 0 3px 0 #2c3e50;
        }
        .emoji-big {
            font-size: 3rem;
            margin-right: 15px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        .choice-btn {
            background: #334155;
            border: none;
            border-bottom: 6px solid #1e293b;
            font-size: 2.5rem;
            padding: 18px 25px;
            border-radius: 70px;
            cursor: pointer;
            transition: 0.08s linear;
            color: white;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 15px #00000050;
            flex: 0 1 auto;
        }
        .choice-btn span {
            font-size: 1.3rem;
            background: #0f172a;
            padding: 6px 16px;
            border-radius: 40px;
        }
        .choice-btn:active {
            border-bottom-width: 2px;
            transform: translateY(4px);
            background: #3b4b5e;
        }
        .choice-btn:hover {
            background: #4b5f73;
        }
        .reset-btn {
            background: #7f8c8d;
            border-bottom-color: #4a5a5c;
            font-size: 1.8rem;
            padding: 18px 35px;
        }
        .footer-move {
            color: #94a3b8;
            text-align: center;
            margin-top: 30px;
            font-size: 1.1rem;
            border-top: 2px dashed #f1c40f40;
            padding-top: 20px;
        }
        .history-btn {
            background: #2c3e50;
            border: 2px solid #f1c40f;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .history-btn:hover {
            background: #f1c40f;
            color: #0f172a;
        }
        .history-panel {
            background: #0a0f1ae0;
            border-radius: 40px;
            padding: 15px;
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #f1c40f;
            color: #b0c4de;
            font-size: 1rem;
        }
        .history-item {
            padding: 5px 12px;
            border-bottom: 1px solid #2d3b4f;
        }
        .highlight-win {
            color: #2ecc71;
            font-weight: 600;
        }
        .highlight-lose {
            color: #e74c3c;
            font-weight: 600;
        }
        .highlight-tie {
            color: #f1c40f;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>✊ PIEDRA · PAPEL · TIJERA ✋</h1>

    <!-- Panel de puntuación -->
    <div class="score-panel">
        <span class="badge">🏆 Jugador</span>
        <span class="score-number" id="player-score">0</span>
        <span class="badge">💻 Computadora</span>
        <span class="score-number" id="computer-score">0</span>
        <span class="badge">🤝 Empates</span>
        <span class="score-number" id="tie-score">0</span>
    </div>

    <!-- Zona versus dinámica -->
    <div class="versus-area">
        <div class="player-zone" id="player-zone">
            <div class="choice-label">TU ELECCIÓN</div>
            <div class="choice-icon" id="player-choice-icon">🤚</div>
        </div>
        <div class="vs-divider">VS</div>
        <div class="computer-zone" id="computer-zone">
            <div class="choice-label">COMPUTADORA</div>
            <div class="choice-icon" id="computer-choice-icon">💻</div>
        </div>
    </div>

    <!-- Resultado de la ronda -->
    <div class="result-box" id="result-box">
        <span class="emoji-big" id="result-emoji">🎮</span>
        <span class="result-text" id="result-message">¡Elige una opción!</span>
    </div>

    <!-- Botones de jugada -->
    <div class="actions">
        <button class="choice-btn" id="rock-btn">🪨 <span>PIEDRA</span></button>
        <button class="choice-btn" id="paper-btn">📄 <span>PAPEL</span></button>
        <button class="choice-btn" id="scissors-btn">✂️ <span>TIJERA</span></button>
        <button class="choice-btn reset-btn" id="reset-btn">🔄 <span>REINICIAR</span></button>
    </div>

    <!-- Botón para mostrar historial (extra) y panel -->
    <div style="display: flex; justify-content: center; gap: 15px; margin-top: 10px;">
        <button class="history-btn" id="toggle-history">📜 Mostrar historial</button>
        <button class="history-btn" id="clear-history-btn">🗑️ Limpiar historial</button>
    </div>
    <div id="history-panel" class="history-panel" style="display: none;"></div>

    <div class="footer-move">
        ⚡ Las reglas clásicas: Piedra gana a Tijera, Tijera gana a Papel, Papel gana a Piedra.
    </div>
</div>

<script>
    (function() {
        // ========== ESTADO DE LA APLICACIÓN ==========
        let playerScore = 0;
        let computerScore = 0;
        let tieCount = 0;
        let history = [];  // guarda objetos { jugador, computadora, resultado, mensaje }

        // Elementos del DOM
        const playerScoreEl = document.getElementById('player-score');
        const computerScoreEl = document.getElementById('computer-score');
        const tieScoreEl = document.getElementById('tie-score');
        const playerChoiceIcon = document.getElementById('player-choice-icon');
        const computerChoiceIcon = document.getElementById('computer-choice-icon');
        const resultMessageEl = document.getElementById('result-message');
        const resultEmojiEl = document.getElementById('result-emoji');
        const historyPanel = document.getElementById('history-panel');
        const toggleHistoryBtn = document.getElementById('toggle-history');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        // Botones de jugada
        const rockBtn = document.getElementById('rock-btn');
        const paperBtn = document.getElementById('paper-btn');
        const scissorsBtn = document.getElementById('scissors-btn');
        const resetBtn = document.getElementById('reset-btn');

        // Mapeo de elección a emoji y nombre
        const choiceMap = {
            piedra: { emoji: '🪨', nombre: 'Piedra' },
            papel: { emoji: '📄', nombre: 'Papel' },
            tijera: { emoji: '✂️', nombre: 'Tijera' }
        };

        // ========== FUNCIONES AUXILIARES ==========
        function getRandomChoice() {
            const random = Math.random();
            if (random < 1/3) return 'piedra';
            if (random < 2/3) return 'papel';
            return 'tijera';
        }

        // Determina el ganador: 'player', 'computer', 'tie'
        function getWinner(playerChoice, computerChoice) {
            if (playerChoice === computerChoice) return 'tie';

            if (
                (playerChoice === 'piedra' && computerChoice === 'tijera') ||
                (playerChoice === 'papel' && computerChoice === 'piedra') ||
                (playerChoice === 'tijera' && computerChoice === 'papel')
            ) {
                return 'player';
            }
            return 'computer';
        }

        // Devuelve emoji y texto según resultado
        function getResultEmotion(winner) {
            if (winner === 'player') return { emoji: '🎉', text: '¡GANASTE!' };
            if (winner === 'computer') return { emoji: '💻👑', text: 'GANA COMPUTADORA' };
            return { emoji: '🤝', text: 'EMPATE' };
        }

        // Actualiza la interfaz con las elecciones y el resultado
        function updateUI(playerChoice, computerChoice, winner) {
            // Actualizar iconos
            playerChoiceIcon.textContent = choiceMap[playerChoice].emoji;
            computerChoiceIcon.textContent = choiceMap[computerChoice].emoji;

            // Actualizar marcadores
            playerScoreEl.textContent = playerScore;
            computerScoreEl.textContent = computerScore;
            tieScoreEl.textContent = tieCount;

            // Mostrar resultado
            const emotion = getResultEmotion(winner);
            resultEmojiEl.textContent = emotion.emoji;
            resultMessageEl.textContent = emotion.text;

            // Cambiar color de borde según ganador (efecto extra)
            const playerZone = document.getElementById('player-zone');
            const computerZone = document.getElementById('computer-zone');
            // Resetear bordes
            playerZone.style.borderColor = '#2ecc71';
            computerZone.style.borderColor = '#e74c3c';

            if (winner === 'player') {
                playerZone.style.borderColor = '#f1c40f';
                playerZone.style.boxShadow = '0 0 15px #f1c40f';
                computerZone.style.boxShadow = 'none';
            } else if (winner === 'computer') {
                computerZone.style.borderColor = '#f1c40f';
                computerZone.style.boxShadow = '0 0 15px #f1c40f';
                playerZone.style.boxShadow = 'none';
            } else {
                playerZone.style.boxShadow = '0 0 12px #a0a0a0';
                computerZone.style.boxShadow = '0 0 12px #a0a0a0';
            }
        }

        // Agrega entrada al historial y renderiza si está visible
        function addHistory(playerChoice, computerChoice, winner) {
            const resultadoTexto = winner === 'player' ? 'Victoria' : (winner === 'computer' ? 'Derrota' : 'Empate');
            let mensaje = `${choiceMap[playerChoice].nombre} vs ${choiceMap[computerChoice].nombre} → ${resultadoTexto}`;
            history.push({
                jugador: playerChoice,
                computadora: computerChoice,
                resultado: winner,
                mensaje: mensaje
            });

            // Si el panel está visible, actualizarlo automáticamente
            if (historyPanel.style.display !== 'none') {
                renderHistory();
            }
        }

        // Renderizar el historial en el panel
        function renderHistory() {
            if (history.length === 0) {
                historyPanel.innerHTML = '<div class="history-item">📭 No hay jugadas aún. ¡Juega una ronda!</div>';
                return;
            }

            let html = '';
            // Mostrar últimos 15, más reciente primero
            const reversed = [...history].reverse().slice(0, 15);
            reversed.forEach(item => {
                let clase = '';
                if (item.resultado === 'player') clase = 'highlight-win';
                else if (item.resultado === 'computer') clase = 'highlight-lose';
                else clase = 'highlight-tie';

                html += `<div class="history-item ${clase}">${item.mensaje}</div>`;
            });
            if (history.length > 15) html += '<div class="history-item">··· más antiguas ···</div>';
            historyPanel.innerHTML = html;
        }

        // Limpiar historial
        function clearHistory() {
            history = [];
            if (historyPanel.style.display !== 'none') {
                renderHistory();
            }
        }

        // ========== LÓGICA PRINCIPAL DEL JUEGO ==========
        function playRound(playerChoice) {
            const computerChoice = getRandomChoice();
            const winner = getWinner(playerChoice, computerChoice);

            // Actualizar puntuación
            if (winner === 'player') playerScore++;
            else if (winner === 'computer') computerScore++;
            else tieCount++;

            // Guardar en historial
            addHistory(playerChoice, computerChoice, winner);

            // Reflejar cambios en UI
            updateUI(playerChoice, computerChoice, winner);
        }

        // Reiniciar juego (marcadores e historial)
        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            tieCount = 0;
            history = [];

            // Resetear UI a estado neutral
            playerChoiceIcon.textContent = '🤚';
            computerChoiceIcon.textContent = '💻';
            playerScoreEl.textContent = '0';
            computerScoreEl.textContent = '0';
            tieScoreEl.textContent = '0';
            resultEmojiEl.textContent = '🎮';
            resultMessageEl.textContent = '¡Elige una opción!';

            // Resetear bordes
            document.getElementById('player-zone').style.borderColor = '#2ecc71';
            document.getElementById('computer-zone').style.borderColor = '#e74c3c';
            document.getElementById('player-zone').style.boxShadow = 'none';
            document.getElementById('computer-zone').style.boxShadow = 'none';

            if (historyPanel.style.display !== 'none') {
                renderHistory();
            }
        }

        // ========== EVENTOS ==========
        rockBtn.addEventListener('click', () => playRound('piedra'));
        paperBtn.addEventListener('click', () => playRound('papel'));
        scissorsBtn.addEventListener('click', () => playRound('tijera'));
        resetBtn.addEventListener('click', resetGame);

        // Toggle historial
        toggleHistoryBtn.addEventListener('click', () => {
            if (historyPanel.style.display === 'none') {
                historyPanel.style.display = 'block';
                renderHistory();
                toggleHistoryBtn.textContent = '📜 Ocultar historial';
            } else {
                historyPanel.style.display = 'none';
                toggleHistoryBtn.textContent = '📜 Mostrar historial';
            }
        });

        // Botón limpiar historial
        clearHistoryBtn.addEventListener('click', () => {
            clearHistory();
        });

        // Inicialización: dejar todo listo (por si acaso)
        resetGame();

        // Pequeño detalle: mostrar empates también en historial con estilo
    })();
</script>
</body>
</html>
